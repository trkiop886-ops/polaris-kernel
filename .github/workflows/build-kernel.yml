name: Build Polaris Kernel (lineage-21 + clang17 + SukiSU + ksud fix + multimode)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install-toolchain
        run: |
          sudo apt update
          sudo apt install -y clang-17 llvm-17 make bison flex bc libssl-dev libelf-dev \
            zip unzip ccache binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi patch
          clang-17 --version | head -2

      - name: clone-kernel
        run: |
          git clone https://github.com/LineageOS/android_kernel_xiaomi_sdm845 kernel -b lineage-21 --depth=400
          cd kernel
          git checkout $(git rev-list -n 1 --before="2025-01-01 00:00" lineage-21) || true
          git log -1 --format="%h %cd %s" --date=short

      - name: integrate-sukisu
        run: |
          echo "== repo root =="
          ls -la
          Z=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then echo "!! no zip in repo root"; exit 1; fi
          echo "== using: $Z =="
          [ "$Z" = "ksu_src.zip" ] || cp -f "$Z" ksu_src.zip
          unzip -q ksu_src.zip -d src
          ls src | head -5
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          mkdir -p KernelSU
          cp -r ../src/ksu/kernel KernelSU/kernel
          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q "CONFIG_KSU" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          python3 - <<'PY'
          p = 'scripts/Makefile.lib'
          s = open(p).read()
          a = "ifeq ($(KBUILD_SRC),)\n__c_flags\t= $(_c_flags)"
          b = "ifeq ($(KBUILD_SRC),)\n__c_flags\t= -I$(srctree)/$(src) $(_c_flags)"
          if a in s:
              s = s.replace(a, b, 1)
          open(p, 'w').write(s)
          print('kbuild include path fixed')
          PY
          ls drivers/kernelsu | head -3

      - name: patch-manual-hooks
        run: |
          cd kernel
          python3 - <<'PY'
          def read(p): return open(p).read()
          def write(p, s): open(p, 'w').write(s)
          def ins_after(path, anchor, block, tag=None):
              s = read(path)
              if tag and tag in s:
                  print('  [skip]', path); return
              i = s.find(anchor)
              if i < 0:
                  print('  [MISS]', path); return
              write(path, s[:i+len(anchor)] + block + s[i+len(anchor):]); print('  [OK] after', path)
          def ins_before(path, anchor, block, tag=None):
              s = read(path)
              if tag and tag in s:
                  print('  [skip]', path); return
              i = s.find(anchor)
              if i < 0:
                  print('  [MISS]', path); return
              write(path, s[:i] + block + s[i:]); print('  [OK] before', path)
          def ins_inside(path, anchor, block, tag=None):
              s = read(path)
              if tag and tag in s:
                  print('  [skip]', path); return
              i = s.find(anchor)
              if i < 0:
                  print('  [MISS]', path); return
              j = s.find('{', i)
              if j < 0:
                  print('  [MISS brace]', path); return
              write(path, s[:j+1] + block + s[j+1:]); print('  [OK] inside', path)
          ins_after('fs/exec.c', '#include <linux/binfmts.h>', '\n#ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n', tag='ksu_handle_execveat')
          ins_inside('fs/exec.c', 'do_execveat_common(int fd, struct filename *filename,', '\n#ifdef CONFIG_KSU\n\tif (ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags))\n\t\treturn -EPERM;\n#endif', tag='ksu_handle_execveat(&fd')
          ins_before('fs/open.c', 'SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)', '\n#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,\n\t\t\t\tint *__unused_flags);\n#endif\n', tag='ksu_handle_faccessat')
          ins_inside('fs/open.c', 'SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)', '\n#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif', tag='ksu_handle_faccessat(&dfd')
          ins_before('fs/stat.c', '#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)', '\n#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif\n', tag='ksu_handle_stat')
          ins_inside('fs/stat.c', 'SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,', '\n#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif', tag='ksu_handle_stat(&dfd')
          ins_inside('fs/stat.c', 'SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,', '\n#ifdef CONFIG_KSU\n\t/* KSU_HOOK_FSTATAT64 */\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif', tag='KSU_HOOK_FSTATAT64')
          ins_before('kernel/reboot.c', 'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,', '\n#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n', tag='ksu_handle_sys_reboot')
          ins_inside('kernel/reboot.c', 'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,', '\n#ifdef CONFIG_KSU\n\tif (ksu_handle_sys_reboot(magic1, magic2, cmd, &arg) == 0)\n\t\treturn 0;\n#endif', tag='ksu_handle_sys_reboot(magic1')
          print('hooks applied')
          PY
          echo "== hooks check (期望 execve=2, faccessat=2, stat=3, reboot=2) =="
          grep -c ksu_handle_execveat fs/exec.c
          grep -c ksu_handle_faccessat fs/open.c
          grep -c ksu_handle_stat fs/stat.c
          grep -c ksu_handle_sys_reboot kernel/reboot.c

      - name: patch-driver-multimode
        run: |
          cd kernel
          python3 - <<'PY'
          p = 'drivers/gpu/drm/msm/dsi-staging/dsi_panel.c'
          s = open(p).read()
          old = "\t/* No multiresolution support is available for video mode panels */\n\tif (panel->panel_mode != DSI_OP_CMD_MODE)\n\t\tcount = SINGLE_MODE_SUPPORT;\n"
          new = "\t/* PATCHED: allow multi-timing for video mode panels (same resolution, different fps) */\n\t(void)SINGLE_MODE_SUPPORT;\n"
          if old in s:
              open(p, 'w').write(s.replace(old, new, 1))
              print('[OK] dsi_panel.c patched: multi-timing enabled for video mode')
          else:
              print('[MISS] target block not found - check kernel source!')
          PY
          echo "== 校验 =="
          grep -n "PATCHED: allow multi-timing" drivers/gpu/drm/msm/dsi-staging/dsi_panel.c || echo "  !! 补丁没打上"
          grep -c "SINGLE_MODE_SUPPORT" drivers/gpu/drm/msm/dsi-staging/dsi_panel.c

      - name: write-config
        run: |
          cd kernel
          cp ../src/utopia.config .config
          ./scripts/config --file .config \
            -d DEBUG_INFO -d DEBUG_INFO_REDUCED -d DEBUG_INFO_SPLIT -d CC_WERROR \
            -e KSU -d KSU_SUSFS -d KSU_SUSFS_SUS_PATH -d KSU_SUSFS_SUS_MOUNT -d KSU_SUSFS_SUS_KSTAT \
            --set-str LOCALVERSION "-perf-g88606771eef3" -d LOCALVERSION_AUTO
          make ARCH=arm64 olddefconfig >/dev/null
          echo "== config check =="
          grep -E '^CONFIG_KSU|^CONFIG_THREAD_INFO_IN_TASK|^CONFIG_BUILD_ARM64_APPENDED' .config || true

      - name: build-kernel
        run: |
          set +e
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang-17 CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC=gcc LLVM_IAS=1
          export KCFLAGS="-Wno-incompatible-pointer-types -Wno-ignored-qualifiers -Wno-implicit-function-declaration -Wno-error -fno-pie"
          mkdir -p /tmp/arm32
          for f in /usr/bin/arm-linux-gnueabi-*; do ln -sf "$f" "/tmp/arm32/$(basename "$f" | sed 's/^arm-linux-gnueabi-//')"; done
          export CROSS_COMPILE_ARM32=/tmp/arm32/
          cd kernel
          grep -rl -- '-Werror' . --include=Makefile 2>/dev/null | grep -v '^./out' | while read f; do
            sed -i 's/-Werror=/-Wno-error=/g; s/-Werror-/-Wno-error=/g; s/-Werror\b/-Wno-error/g' "$f"
          done
          echo "==== round1 ===="
          make -j$(nproc --all) Image.gz-dtb 2>&1 | tee build.log
          if [ ! -f arch/arm64/boot/Image.gz-dtb ]; then
            echo "==== round2: no COMPAT_VDSO ===="
            ./scripts/config --file .config -d COMPAT_VDSO
            make ARCH=arm64 olddefconfig >/dev/null
            make -j$(nproc --all) Image.gz-dtb 2>&1 | tee -a build.log
          fi
          if [ ! -f arch/arm64/boot/Image.gz-dtb ] && [ ! -f arch/arm64/boot/Image.gz ]; then
            echo "======== FAILED ========"
            grep -nE "error:|fatal error" build.log | tail -30
            echo "---------------- tail -20 ----------------"
            tail -20 build.log
            exit 1
          fi
          echo "==== OK ===="
          ls -lh arch/arm64/boot/ | head -6
          strings arch/arm64/boot/Image 2>/dev/null | grep -m1 "Linux version" || true

      - name: package-anykernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          cd AnyKernel3
          rm -f Image* zImage* 2>/dev/null || true
          if [ -f ../kernel/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../kernel/arch/arm64/boot/Image.gz-dtb ./Image.gz
          elif [ -f ../kernel/arch/arm64/boot/Image.gz ]; then
            cp ../kernel/arch/arm64/boot/Image.gz ./Image.gz
          else
            cp ../kernel/arch/arm64/boot/Image ./Image
          fi
          sed -i 's/device.name1=.*/device.name1=polaris/' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          zip -r9 ../polaris-ksu-mm-$(date +%Y%m%d).zip *
          cd ..
          unzip -l polaris-ksu-mm-*.zip | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: polaris-ksu-mm-zip
          path: polaris-ksu-mm-*.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: kernel/build.log
          if-no-files-found: ignore