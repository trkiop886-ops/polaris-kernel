name: Build Polaris Kernel (lineage-21 + clang17 + ReSukiSU 满血root)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装完整编译工具链
        run: |
          sudo apt update
          sudo apt install -y clang-17 llvm-17 make bison flex bc libssl-dev libelf-dev \
            zip unzip ccache binutils binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi patch
          clang-17 --version | head -2
          aarch64-linux-gnu-gcc --version | head -1

      - name: 拉取 lineage-21 内核源码
        run: |
          git clone https://github.com/LineageOS/android_kernel_xiaomi_sdm845 kernel -b lineage-21 --depth=400
          cd kernel
          git checkout $(git rev-list -n 1 --before="2025-01-01 00:00" lineage-21) || true
          git log -1 --format="%h %cd %s" --date=short

      - name: 集成 ReSukiSU 核心
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: 打全量手动hook补丁（满血root核心）
        run: |
          cd kernel
          
          # 1. 优先尝试官方4.9完整补丁，失败自动走兜底
          curl -fLSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/patches/4.9-manual-hook.patch" -o /tmp/ksu_full_hook.patch || true
          if [ -s /tmp/ksu_full_hook.patch ]; then
            patch -p1 < /tmp/ksu_full_hook.patch
          else
            # 兜底：仅保留已验证可编译的 exec.c 完整钩子
            sed -i '/^#include <linux\/binfmts.h>/a \
            #ifdef CONFIG_KSU_MANUAL_HOOK \
            extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, \
                                           struct user_arg_ptr argv, struct user_arg_ptr envp, int *flags); \
            #endif' fs/exec.c
            sed -i '/do_execveat_common(int fd, struct filename *filename,/i \
            #ifdef CONFIG_KSU_MANUAL_HOOK \
                    if (ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags)) \
                            return -EPERM; \
            #endif' fs/exec.c
            sed -i '/int do_execve(struct filename *filename,/a \
            #ifdef CONFIG_KSU_MANUAL_HOOK \
                    struct user_arg_ptr argv = { .ptr.native = argv }; \
                    struct user_arg_ptr envp = { .ptr.native = envp }; \
                    int flags = 0; \
                    if (ksu_handle_execveat(&(int){AT_FDCWD}, &filename, argv, envp, &flags)) \
                            return -EPERM; \
            #endif' fs/exec.c
          fi
          
          # 2. susfs 编译防护
          F=drivers/kernelsu/kernel_includes.h
          if [ -f "$F" ] && grep -q '#include <linux/susfs.h>' "$F" && ! grep -q 'ifdef CONFIG_KSU_SUSFS' "$F"; then
            sed -i 's|#include <linux/susfs.h>|#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif|' "$F"
          fi
          
          # 3. 清理提示行
          sed -i '/You should integrate ReSukiSU in your kernel/d' drivers/kernelsu/Kbuild 2>/dev/null || true

      - name: 内核配置 + 编译
        run: |
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang-17
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export HOSTCC=gcc
          export KCFLAGS="-Wno-incompatible-pointer-types -Wno-ignored-qualifiers -Wno-implicit-function-declaration"
          export USE_CCACHE=1
          ccache -M 5G
          
          cd kernel
          mkdir -p out
          
          # 加载设备默认配置
          make O=out ARCH=arm64 sdm845_defconfig
          [ -f arch/arm64/configs/vendor/xiaomi/mi845_defconfig ] && cat arch/arm64/configs/vendor/xiaomi/mi845_defconfig >> out/.config || true
          [ -f arch/arm64/configs/vendor/xiaomi/polaris.config ] && cat arch/arm64/configs/vendor/xiaomi/polaris.config >> out/.config || true
          
          make O=out olddefconfig
          
          # 满血root必开配置
          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -e KSU_MANUAL_HOOK || true
          ./scripts/config --file out/.config -d KSU_SUSFS || true
          ./scripts/config --file out/.config -e KALLSYMS_ALL
          
          make O=out olddefconfig
          
          # 打印配置验证
          echo "=== KSU 配置检查 ==="
          grep -E '^CONFIG_KSU|^CONFIG_KALLSYMS_ALL|^CONFIG_KSU_MANUAL_HOOK' out/.config
          
          # 编译内核
          make O=out -j$(nproc --all) Image.gz-dtb 2>&1 | tee build.log || make O=out -j$(nproc --all) 2>&1 | tee -a build.log
          
          # 输出编译结果
          ls -lh out/arch/arm64/boot/
          strings out/arch/arm64/boot/Image.gz* 2>/dev/null | grep -m1 "Linux version" || true

      - name: 打包 AnyKernel3 卡刷包
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          cd AnyKernel3
          rm -f Image* zImage* 2>/dev/null || true
          
          if   [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then cp ../kernel/out/arch/arm64/boot/Image.gz-dtb ./Image.gz
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ];     then cp ../kernel/out/arch/arm64/boot/Image.gz ./Image.gz
          else cp ../kernel/out/arch/arm64/boot/Image ./Image; fi
          
          ls -l Image*
          sed -i 's/device.name1=.*/device.name1=polaris/' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          zip -r9 ../polaris-ksu-full-$(date +%Y%m%d).zip *
          cd ..
          unzip -l polaris-ksu-full-*.zip | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: polaris-ksu-满血root包
          path: polaris-ksu-full-*.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 编译日志
          path: kernel/build.log
          if-no-files-found: ignore
