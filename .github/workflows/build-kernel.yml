name: Build Polaris Kernel (lineage-21 + clang17 + ReSukiSU manual-hook)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装编译工具链
        run: |
          sudo apt update
          sudo apt install -y clang-17 llvm-17 make bison flex bc libssl-dev libelf-dev \
            zip unzip ccache binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi patch python3
          clang-17 --version | head -2

      - name: 拉源码（lineage-21，钉到 2024-12）
        run: |
          git clone https://github.com/LineageOS/android_kernel_xiaomi_sdm845 kernel -b lineage-21 --depth=400
          cd kernel
          git checkout $(git rev-list -n 1 --before="2025-01-01 00:00" lineage-21) || true
          git log -1 --format="%h %cd %s" --date=short

      - name: 集成 ReSukiSU + 自动挑带手动钩子定义的旧版本
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          cd KernelSU
          git fetch --unshallow --tags 2>/dev/null || true
          PICK=""
          for T in v3.2.0 v3.1.9 v3.1.8 v3.1.7; do
            git checkout -f "$T" >/dev/null 2>&1 || continue
            D=$(grep -rn "int ksu_handle_execveat(" kernel --include="*.c" 2>/dev/null | wc -l)
            F=$(grep -rn "int ksu_handle_faccessat(" kernel --include="*.c" 2>/dev/null | wc -l)
            S=$(grep -rn "int ksu_handle_stat(" kernel --include="*.c" 2>/dev/null | wc -l)
            echo "== $T : execveat定义=$D  faccessat定义=$F  stat定义=$S"
            if [ "$D" -ge 1 ] && [ "$F" -ge 1 ] && [ "$S" -ge 1 ]; then PICK="$T"; break; fi
          done
          if [ -n "$PICK" ]; then git checkout -f "$PICK"; echo ">>> 选定 $PICK"; else echo ">>> 没有带定义的老版本(日志里能看到),继续用当前"; fi
          git describe --tags 2>/dev/null || true

      - name: 打手动钩子（execve×2 + faccessat + stat）
        run: |
          cd kernel
          python3 - <<'PY'
          def read(p): return open(p).read()
          def write(p,s): open(p,'w').write(s)
          def ins_after(path, anchor, block, start=0):
              s=read(path); i=s.find(anchor,start)
              if i<0: print('  [MISS]',path,anchor[:40]); return
              write(path, s[:i+len(anchor)]+block+s[i+len(anchor)]); print('  [OK] 后插',path)
          def ins_inside(path, anchor, block, tag=None):
              s=read(path)
              if tag and tag in s: print('  [skip]',path); return
              i=s.find(anchor)
              if i<0: print('  [MISS]',path,anchor[:40]); return
              j=s.find('{',i)
              if j<0: print('  [MISS brace]',path); return
              write(path, s[:j+1]+block+s[j+1:]); print('  [OK] 函数内',path)
          def ins_before(path, anchor, block):
              s=read(path)
              if block.strip() in s: print('  [skip]',path); return
              i=s.find(anchor)
              if i<0: print('  [MISS]',path,anchor[:40]); return
              write(path, s[:i]+block+s[i:]); print('  [OK] 前插',path)
          def ins_after_struct(path, anchor, block, fallback=None):
              s=read(path); i=s.find(anchor)
              if i<0:
                  if fallback: return ins_after(path, fallback, block)
                  print('  [MISS]',path); return
              j=s.find('};', i); write(path, s[:j+2]+block+s[j+2:]); print('  [OK] 结构体后',path)

          ins_after_struct('fs/exec.c','struct user_arg_ptr {',
            '\n#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n\t\t\t\tvoid *argv, void *envp, int *flags);\n#endif\n',
            fallback='#include <linux/binfmts.h>')
          ins_inside('fs/exec.c','do_execveat_common(int fd, struct filename *filename,',
            '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tif (ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags))\n\t\treturn -EPERM;\n#endif')
          ins_inside('fs/exec.c','int do_execve(struct filename *filename,',
            '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tstruct user_arg_ptr ksu_argv = { .ptr.native = __argv };\n\tstruct user_arg_ptr ksu_envp = { .ptr.native = __envp };\n\tint ksu_flags = 0;\n\tif (ksu_handle_execveat(&(int){AT_FDCWD}, &filename, &ksu_argv, &ksu_envp, &ksu_flags))\n\t\treturn -EPERM;\n#endif')
          ins_before('fs/open.c','SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)',
            '\n#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n\t\t\t\tint *mode, int *flags);\n#endif\n')
          ins_inside('fs/open.c','SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)',
            '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif')
          ins_before('fs/stat.c','#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)',
            '\n#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n\t\t\t\tint *flags);\n#endif\n')
          ins_inside('fs/stat.c','SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,',
            '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif', tag='ksu_handle_stat(&dfd')
          ins_inside('fs/stat.c','SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,',
            '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif')

          print('=== 钩子统计 ===')
          import sys
          _bad = False
          for p,k in [('fs/exec.c','ksu_handle_execveat'),
                      ('fs/open.c','ksu_handle_faccessat'),
                      ('fs/stat.c','ksu_handle_stat')]:
              _c = read(p).count(k)
              print(' ', p, _c)
              if _c < 2: _bad = True
          sys.exit('!! 钩子没插全, 中止' if _bad else 0)
          PY

      - name: 内核配置 + 编译
        run: |
          set +e
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang-17
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export HOSTCC=gcc
          export LLVM_IAS=1
          export KCFLAGS="-Wno-incompatible-pointer-types -Wno-ignored-qualifiers -Wno-implicit-function-declaration -Wno-unknown-warning-option -fno-pie"
          export USE_CCACHE=1; ccache -M 5G
          mkdir -p /tmp/arm32
          for f in /usr/bin/arm-linux-gnueabi-*; do ln -sf "$f" "/tmp/arm32/$(basename "$f" | sed 's/^arm-linux-gnueabi-//')"; done
          export CROSS_COMPILE_ARM32=/tmp/arm32/
          cd kernel
          grep -rl -- '-Werror' . --include=Makefile 2>/dev/null | grep -v '^./out' | while read f; do \
            sed -i 's/-Werror=/-Wno-error=/g; s/-Werror-/-Wno-error=/g; s/-Werror\b/-Wno-error/g' "$f"; done
          mkdir -p out
          make O=out ARCH=arm64 CC=clang-17 HOSTCC=gcc sdm845_defconfig
          [ -f out/.config ] || { echo "!! defconfig 失败"; exit 1; }
          [ -f arch/arm64/configs/vendor/xiaomi/mi845_defconfig ] && cat arch/arm64/configs/vendor/xiaomi/mi845_defconfig >> out/.config
          [ -f arch/arm64/configs/vendor/xiaomi/polaris.config ] && cat arch/arm64/configs/vendor/xiaomi/polaris.config >> out/.config
          make O=out ARCH=arm64 CC=clang-17 HOSTCC=gcc olddefconfig
          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -e KSU_MANUAL_HOOK || true
          ./scripts/config --file out/.config -d KSU_SUSFS || true
          ./scripts/config --file out/.config -e KALLSYMS_ALL || true
          make O=out ARCH=arm64 CC=clang-17 HOSTCC=gcc olddefconfig
          grep -E '^CONFIG_KSU|^CONFIG_KALLSYMS_ALL' out/.config || true
          echo "==== 编译 ===="
          make O=out ARCH=arm64 CC=clang-17 HOSTCC=gcc -j$(nproc --all) Image.gz-dtb 2>&1 | tee build.log
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            make O=out ARCH=arm64 CC=clang-17 HOSTCC=gcc -j$(nproc --all) 2>&1 | tee -a build.log
          fi
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ] && [ ! -f out/arch/arm64/boot/Image.gz ] && [ ! -f out/arch/arm64/boot/Image ]; then
            echo "======== 失败,真错误 ========"; grep -nE "error:|Error [0-9]|undefined" build.log | tail -40; exit 1
          fi
          echo "==== 成功 ===="; ls -lh out/arch/arm64/boot/
          strings out/arch/arm64/boot/Image.gz* 2>/dev/null | grep -m1 "Linux version" || true

      - name: 打包 AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          cd AnyKernel3
          rm -f Image* zImage* 2>/dev/null || true
          if   [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then cp ../kernel/out/arch/arm64/boot/Image.gz-dtb ./Image.gz
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ];     then cp ../kernel/out/arch/arm64/boot/Image.gz ./Image.gz
          else cp ../kernel/out/arch/arm64/boot/Image ./Image; fi
          sed -i 's/device.name1=.*/device.name1=polaris/' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          zip -r9 ../polaris-ksu-$(date +%Y%m%d).zip *
          cd ..; unzip -l polaris-ksu-*.zip | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: polaris-ksu-zip
          path: polaris-ksu-*.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: kernel/build.log
          if-no-files-found: ignore
