name: Build Polaris Kernel (lineage-21 + clang17 + SukiSU + SUSFS)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install-toolchain
        run: |
          sudo apt update
          sudo apt install -y clang-17 llvm-17 make bison flex bc libssl-dev libelf-dev \
            zip unzip ccache binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi patch
          clang-17 --version | head -2

      - name: clone-kernel
        run: |
          git clone https://github.com/LineageOS/android_kernel_xiaomi_sdm845 kernel -b lineage-21 --depth=400
          cd kernel
          git checkout $(git rev-list -n 1 --before="2025-01-01 00:00" lineage-21) || true
          git log -1 --format="%h %cd %s" --date=short

      - name: integrate-sukisu
        run: |
          echo "== repo root =="
          ls -la
          Z=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then echo "!! no zip in repo root"; exit 1; fi
          echo "== using: $Z =="
          [ "$Z" = "ksu_src.zip" ] || cp -f "$Z" ksu_src.zip
          unzip -q ksu_src.zip -d src
          ls src | head -5
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          mkdir -p KernelSU
          cp -r ../src/ksu/kernel KernelSU/kernel
          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q "CONFIG_KSU" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          python3 - <<'PY'
          p = 'scripts/Makefile.lib'
          s = open(p).read()
          a = "ifeq ($(KBUILD_SRC),)\n__c_flags\t= $(_c_flags)"
          b = "ifeq ($(KBUILD_SRC),)\n__c_flags\t= -I$(srctree)/$(src) $(_c_flags)"
          if a in s:
              s = s.replace(a, b, 1)
          open(p, 'w').write(s)
          print('kbuild include path fixed')
          PY
          ls drivers/kernelsu | head -3

      - name: apply-susfs
        run: |
          cd kernel
          echo "== 下载 susfs4ksu (kernel-4.9 分支) =="
          curl -fL --retry 3 --max-time 300 -o /tmp/susfs.tar.gz \
            "https://gitlab.com/simonpunk/susfs4ksu/-/archive/kernel-4.9/susfs4ksu-kernel-4.9.tar.gz"
          tar -xzf /tmp/susfs.tar.gz -C /tmp
          S=/tmp/susfs4ksu-kernel-4.9/kernel_patches
          ls $S
          cp -f $S/fs/susfs.c fs/
          cp -f $S/include/linux/susfs.h $S/include/linux/susfs_def.h $S/include/linux/sus_su.h include/linux/ 2>/dev/null || true
          echo "== 打内核补丁(允许部分失败, 下面手工补) =="
          patch -p1 --forward --no-backup-if-mismatch < $S/50_add_susfs_in_kernel-4.9.patch || true
          echo "== 补 8 个新版 SUSFS 常量(这套 KSU 源要用, 4.9 老分支里还没有) =="
          cat >> include/linux/susfs_def.h <<'EOF'

          #ifndef SUSFS_MAGIC
          #define SUSFS_MAGIC 0xFAFAFAFA
          #endif
          #ifndef CMD_SUSFS_SET_ANDROID_DATA_ROOT_PATH
          #define CMD_SUSFS_SET_ANDROID_DATA_ROOT_PATH 0x55551
          #endif
          #ifndef CMD_SUSFS_SET_SDCARD_ROOT_PATH
          #define CMD_SUSFS_SET_SDCARD_ROOT_PATH 0x55552
          #endif
          #ifndef CMD_SUSFS_ADD_SUS_PATH_LOOP
          #define CMD_SUSFS_ADD_SUS_PATH_LOOP 0x55553
          #endif
          #ifndef CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS
          #define CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS 0x55561
          #endif
          #ifndef CMD_SUSFS_UMOUNT_FOR_ZYGOTE_ISO_SERVICE
          #define CMD_SUSFS_UMOUNT_FOR_ZYGOTE_ISO_SERVICE 0x55562
          #endif
          #ifndef CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING
          #define CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING 0x60010
          #endif
          #ifndef CMD_SUSFS_ADD_SUS_MAP
          #define CMD_SUSFS_ADD_SUS_MAP 0x60020
          #endif
          EOF
          echo "== 手工补那两处(LineageOS 版本差异) =="
          python3 - <<'PY'
          def rd(p): return open(p).read()
          def wr(p, s): open(p, 'w').write(s)
          p = 'fs/proc/task_mmu.c'; s = rd(p); a = '#include <linux/mm_inline.h>\n'
          if 'susfs_def.h' not in s and a in s:
              wr(p, s.replace(a, a + '#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif\n', 1)); print('[fix] task_mmu.c')
          p = 'fs/proc/cmdline.c'; s = rd(p); a = '#include <linux/seq_file.h>\n'
          if 'susfs_spoof_cmdline_or_bootconfig' not in s and a in s:
              s = s.replace(a, a + '\n#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\nextern int susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n#endif\n', 1)
              c = '{\n#ifdef CONFIG_INITRAMFS_IGNORE_SKIP_FLAG\n\tseq_printf(m, "%s\\n", proc_command_line);'
              d = '{\n#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n\tif (!susfs_spoof_cmdline_or_bootconfig(m)) {\n\t\tseq_putc(m, \'\\n\');\n\t\treturn 0;\n\t}\n#endif\n#ifdef CONFIG_INITRAMFS_IGNORE_SKIP_FLAG\n\tseq_printf(m, "%s\\n", proc_command_line);'
              if c in s:
                  s = s.replace(c, d, 1)
              wr(p, s); print('[fix] cmdline.c')
          PY
          find . -name "*.rej" -delete 2>/dev/null || true
          echo "== 落地检查(应看到 61 / 4 / 1) =="
          grep -c susfs fs/namespace.c
          grep -c susfs fs/stat.c
          grep -c susfs kernel/kallsyms.c

      - name: patch-manual-hooks
        run: |
          cd kernel
          python3 - <<'PY'
          def read(p): return open(p).read()
          def write(p, s): open(p, 'w').write(s)
          def ins_after(path, anchor, block):
              s = read(path); i = s.find(anchor)
              if i < 0:
                  print('  [MISS]', path); return
              write(path, s[:i+len(anchor)] + block + s[i+len(anchor):]); print('  [OK] after', path)
          def ins_inside(path, anchor, block):
              s = read(path); i = s.find(anchor)
              if i < 0:
                  print('  [MISS]', path); return
              j = s.find('{', i)
              if j < 0:
                  print('  [MISS brace]', path); return
              write(path, s[:j+1] + block + s[j+1:]); print('  [OK] inside', path)
          ins_after('fs/exec.c', '#include <linux/binfmts.h>', '\n#ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n')
          ins_inside('fs/exec.c', 'do_execveat_common(int fd, struct filename *filename,', '\n#ifdef CONFIG_KSU\n\tif (ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags))\n\t\treturn -EPERM;\n#endif')
          print('hooks applied')
          PY
          echo "== execve 钩子数(期望 2) =="
          grep -c ksu_handle_execveat fs/exec.c

      - name: write-config
        run: |
          cd kernel
          cp ../src/utopia.config .config
          ./scripts/config --file .config \
            -d DEBUG_INFO -d DEBUG_INFO_REDUCED -d DEBUG_INFO_SPLIT -d CC_WERROR \
            -e KSU -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT \
            --set-str LOCALVERSION "-perf-g88606771eef3" -d LOCALVERSION_AUTO
          make ARCH=arm64 olddefconfig >/dev/null
          echo "== config check =="
          grep -E '^CONFIG_KSU|^CONFIG_THREAD_INFO_IN_TASK|^CONFIG_BUILD_ARM64_APPENDED' .config || true

      - name: build-kernel
        run: |
          set +e
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang-17 CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC=gcc LLVM_IAS=1
          export KCFLAGS="-Wno-incompatible-pointer-types -Wno-ignored-qualifiers -Wno-implicit-function-declaration -Wno-error -fno-pie"
          mkdir -p /tmp/arm32
          for f in /usr/bin/arm-linux-gnueabi-*; do ln -sf "$f" "/tmp/arm32/$(basename "$f" | sed 's/^arm-linux-gnueabi-//')"; done
          export CROSS_COMPILE_ARM32=/tmp/arm32/
          cd kernel
          grep -rl -- '-Werror' . --include=Makefile 2>/dev/null | grep -v '^./out' | while read f; do
            sed -i 's/-Werror=/-Wno-error=/g; s/-Werror-/-Wno-error=/g; s/-Werror\b/-Wno-error/g' "$f"
          done
          echo "==== round1 ===="
          make -j$(nproc --all) Image.gz-dtb 2>&1 | tee build.log
          if [ ! -f arch/arm64/boot/Image.gz-dtb ]; then
            echo "==== round2: no COMPAT_VDSO ===="
            ./scripts/config --file .config -d COMPAT_VDSO
            make ARCH=arm64 olddefconfig >/dev/null
            make -j$(nproc --all) Image.gz-dtb 2>&1 | tee -a build.log
          fi
          if [ ! -f arch/arm64/boot/Image.gz-dtb ] && [ ! -f arch/arm64/boot/Image.gz ]; then
            echo "======== FAILED ========"
            grep -nE "error:|fatal error" build.log | tail -30
            echo "---------------- tail -20 ----------------"
            tail -20 build.log
            exit 1
          fi
          echo "==== OK ===="
          ls -lh arch/arm64/boot/ | head -6
          strings arch/arm64/boot/Image 2>/dev/null | grep -m1 "Linux version" || true

      - name: package-anykernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          cd AnyKernel3
          rm -f Image* zImage* 2>/dev/null || true
          if [ -f ../kernel/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../kernel/arch/arm64/boot/Image.gz-dtb ./Image.gz
          elif [ -f ../kernel/arch/arm64/boot/Image.gz ]; then
            cp ../kernel/arch/arm64/boot/Image.gz ./Image.gz
          else
            cp ../kernel/arch/arm64/boot/Image ./Image
          fi
          sed -i 's/device.name1=.*/device.name1=polaris/' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          zip -r9 ../polaris-ksu-susfs-$(date +%Y%m%d).zip *
          cd ..
          unzip -l polaris-ksu-susfs-*.zip | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: polaris-ksu-susfs-zip
          path: polaris-ksu-susfs-*.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: kernel/build.log
          if-no-files-found: ignore
